transcript_id: asthma_good
case_id: asthma_exacerbation_001
student_level: good
conversation:
  - speaker: patient
    text: "My chest feels tight and my inhaler is not lasting very long."
  - speaker: clinician
    text: "I understand that is scary. Can you speak full sentences and how severe is your shortness of breath?"
  - speaker: patient
    text: "I can speak, but stairs are hard."
  - speaker: clinician
    text: "Any wheeze, cough, fever, chest pain, allergies, or triggers like cold air?"
  - speaker: patient
    text: "Wheezing and cough after a cold, no fever."
  - speaker: clinician
    text: "How often are you using the rescue inhaler, and have you missed or stopped your controller medication?"
  - speaker: patient
    text: "I ran out of my controller inhaler."
  - speaker: clinician
    text: "Have you ever been hospitalized for asthma or needed intensive care?"
  - speaker: patient
    text: "No."
  - speaker: clinician
    text: "The plan is to assess your breathing now, treat the exacerbation, restart controller therapy, and review when to seek emergency care."
