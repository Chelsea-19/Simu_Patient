conversation:
  - speaker: patient
    text: "I'm about six weeks pregnant and I'm having cramps with a little bleeding."
  - speaker: clinician
    text: "I am sorry, that must be worrying. How many weeks pregnant are you and where exactly is the pain?"
  - speaker: patient
    text: "Six weeks, left lower abdomen."
  - speaker: clinician
    text: "Any vaginal bleeding amount, dizziness, syncope, shoulder tip pain, urinary symptoms, or fever?"
  - speaker: patient
    text: "Light bleeding, dizziness, and some shoulder pain."
  - speaker: clinician
    text: "Tell me about prior pregnancies, any prior ectopic pregnancy, fertility treatment, contraception, and your blood type if you know it."
  - speaker: patient
    text: "I had an ectopic pregnancy before."
  - speaker: clinician
    text: "I am concerned about ectopic pregnancy and possible instability. The urgent next step is immediate assessment, pregnancy testing, ultrasound, blood work, and safety monitoring."
