  - speaker: patient
    text: "The copays get too expensive."
  - speaker: clinician
    text: "What is your daily routine and do you have support?"
  - speaker: patient
    text: "My schedule changes a lot."
  - speaker: clinician
    text: "We can simplify the plan and discuss lower-cost options with the pharmacy."
