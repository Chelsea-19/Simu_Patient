    text: "I know my numbers are not great, but taking all these pills has been hard."
  - speaker: clinician
    text: "Can you tell me which medications you miss and how often you miss doses?"
  - speaker: patient
    text: "Mostly metformin and the blood pressure pills near the end of the month."
  - speaker: clinician
